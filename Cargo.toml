[package]
name = "brust"
version = "0.1.0"
authors = ["Thomas Campistron <irevoire@hotmail.fr>"]
edition = "2021"

[dependencies]
anyhow = "1.0.51"
codespan-reporting = "0.11.1"
dicey = { git = "https://github.com/irevoire/dicey" }
kankyo = "0.3.0"
miette = { version = "5.1.0", features = ["fancy"] }
numbat = "1.6.3"
rand = { version = "0.8.0", features = ["small_rng"] }
reqwest = { version = "0.13", features = ["rustls", "json"], default-features = false }
select = "0.6"
serde_json = "1.0"
serenity = { version = "0.10", features = ["collector", "client", "gateway", "rustls_backend", "model", "unstable_discord_api"] }
tokio = { version = "1", features = ["full"] }
uwuify = "0.2.2"

[profile.release]
opt-level = "z"  # Optimize for size.
strip = true
lto = true
panic = "abort"
